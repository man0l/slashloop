name: build-worker-image

# Auto-build the VPS worker Docker image on changes to master, and push it to
# GitHub Container Registry (ghcr.io/man0l/slashloop-worker).
#
# The runtime .env is baked into the image AT BUILD TIME: this workflow
# assembles it from the repo GitHub variables + secrets and passes it to the
# Docker build as a BuildKit secret-file (worker/Dockerfile copies it to
# /app/.env, which Bun auto-loads). Secrets are never uploaded as artifacts or
# committed to git.
#
# Why paths: the image only changes when queue-drain / analysis code changes,
# not on docs or frontend tweaks — matching the "build if the worker's code has
# changed" rule. Run the workflow manually (Actions -> build-worker-image ->
# Run workflow) to force a rebuild.
on:
  push:
    branches: [master]
    paths:
      - 'src/worker/**'
      - 'src/analysis/**'
      - 'src/lib/**'
      - 'src/scoring.ts'
      - 'src/register-tools.ts'
      - 'src/db.ts'
      - 'api/jobs/analyze.ts'
      - 'prisma/**'
      - 'worker/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/**'
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Assemble the worker .env from GitHub variables (non-secret config) and
      # secrets (keys). Any secret not yet set (DATABASE_URL, GEMINI_API_KEY,
      # APIFY_API_KEY, DIRECT_URL) renders empty until it is added to GitHub —
      # add it, then re-run this workflow. Written into the build context as
      # .worker-env (NOT a BuildKit secret — the docker-container builder runs
      # in a separate container and can't see the runner's filesystem, so
      # secret-files never reach the build); .dockerignore allows it through
      # and worker/Dockerfile copies it to /app/.env. Never committed to git.
      - name: Prepare worker .env
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          APIFY_SPEND_CAP_CENTS: ${{ vars.APIFY_SPEND_CAP_CENTS }}
          APIFY_TIKTOK_ACTOR_ID: ${{ vars.APIFY_TIKTOK_ACTOR_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VIDEO_MODEL: ${{ vars.OPENROUTER_VIDEO_MODEL }}
          OPENROUTER_VIDEO_MODE: ${{ vars.OPENROUTER_VIDEO_MODE }}
          OPENROUTER_VIDEO_TIMEOUT_MS: ${{ vars.OPENROUTER_VIDEO_TIMEOUT_MS }}
          OPENROUTER_VIDEO_MAX_DURATION_SEC: ${{ vars.OPENROUTER_VIDEO_MAX_DURATION_SEC }}
          STORAGE_MEDIA_BUCKET: ${{ vars.STORAGE_MEDIA_BUCKET }}
          STORAGE_THUMB_BUCKET: ${{ vars.STORAGE_THUMB_BUCKET }}
          MEDIA_SIGNED_URL_TTL_SECONDS: ${{ vars.MEDIA_SIGNED_URL_TTL_SECONDS }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          WORKER_IDLE_MS: ${{ vars.WORKER_IDLE_MS }}
          WORKER_RESCORE_EVERY: ${{ vars.WORKER_RESCORE_EVERY }}
        run: |
          set -e
          out="$GITHUB_WORKSPACE/.worker-env"
          : > "$out"
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL"            >> "$out"
          printf 'DIRECT_URL=%s\n' "$DIRECT_URL"                >> "$out"
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"            >> "$out"
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"  >> "$out"
          printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY" >> "$out"
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"        >> "$out"
          printf 'APIFY_API_KEY=%s\n' "$APIFY_API_KEY"          >> "$out"
          printf 'APIFY_SPEND_CAP_CENTS=%s\n' "$APIFY_SPEND_CAP_CENTS" >> "$out"
          printf 'APIFY_TIKTOK_ACTOR_ID=%s\n' "$APIFY_TIKTOK_ACTOR_ID" >> "$out"
          printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" >> "$out"
          printf 'OPENROUTER_VIDEO_MODEL=%s\n' "$OPENROUTER_VIDEO_MODEL" >> "$out"
          printf 'OPENROUTER_VIDEO_MODE=%s\n' "$OPENROUTER_VIDEO_MODE" >> "$out"
          printf 'OPENROUTER_VIDEO_TIMEOUT_MS=%s\n' "$OPENROUTER_VIDEO_TIMEOUT_MS" >> "$out"
          printf 'OPENROUTER_VIDEO_MAX_DURATION_SEC=%s\n' "$OPENROUTER_VIDEO_MAX_DURATION_SEC" >> "$out"
          printf 'STORAGE_MEDIA_BUCKET=%s\n' "$STORAGE_MEDIA_BUCKET" >> "$out"
          printf 'STORAGE_THUMB_BUCKET=%s\n' "$STORAGE_THUMB_BUCKET" >> "$out"
          printf 'MEDIA_SIGNED_URL_TTL_SECONDS=%s\n' "$MEDIA_SIGNED_URL_TTL_SECONDS" >> "$out"
          printf 'PUBLIC_URL=%s\n' "$PUBLIC_URL"                >> "$out"
          printf 'WORKER_IDLE_MS=%s\n' "$WORKER_IDLE_MS"        >> "$out"
          printf 'WORKER_RESCORE_EVERY=%s\n' "$WORKER_RESCORE_EVERY" >> "$out"
          ls -la "$out"
          echo "lines: $(wc -l < "$out")"
          echo "video-model-marker: $(grep -c '^OPENROUTER_VIDEO_MODEL=' "$out")"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push worker image (with baked .env)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ghcr.io/man0l/slashloop-worker:master
            ghcr.io/man0l/slashloop-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
