name: build-worker-image

# Auto-build the VPS worker Docker image on changes to master, and push it to
# GitHub Container Registry (ghcr.io/man0l/slashloop-worker).
#
# The runtime .env is baked into the image AT BUILD TIME: this workflow
# assembles it from the repo GitHub variables + secrets and passes it to the
# Docker build as a BuildKit secret-file (worker/Dockerfile copies it to
# /app/.env, which Bun auto-loads). Secrets are never uploaded as artifacts or
# committed to git.
#
# Why paths: the image only changes when queue-drain / analysis code changes,
# not on docs or frontend tweaks — matching the "build if the worker's code has
# changed" rule. Run the workflow manually (Actions -> build-worker-image ->
# Run workflow) to force a rebuild.
on:
  push:
    branches: [master]
    paths:
      - 'src/worker/**'
      - 'src/analysis/**'
      - 'src/lib/**'
      - 'src/scoring.ts'
      - 'src/register-tools.ts'
      - 'src/db.ts'
      - 'api/jobs/analyze.ts'
      - 'prisma/**'
      - 'worker/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/**'
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Assemble the worker .env from GitHub variables (non-secret config) and
      # secrets (keys). Any secret not yet set (DATABASE_URL, GEMINI_API_KEY,
      # APIFY_API_KEY, DIRECT_URL) renders empty until it is added to GitHub —
      # add it, then re-run this workflow. Written into the build context as
      # .worker-env (NOT a BuildKit secret — the docker-container builder runs
      # in a separate container and can't see the runner's filesystem, so
      # secret-files never reach the build); .dockerignore allows it through
      # and worker/Dockerfile copies it to /app/.env. Never committed to git.
      - name: Prepare worker .env
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          APIFY_SPEND_CAP_CENTS: ${{ vars.APIFY_SPEND_CAP_CENTS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VIDEO_MODEL: ${{ vars.OPENROUTER_VIDEO_MODEL }}
          OPENROUTER_VIDEO_MODE: ${{ vars.OPENROUTER_VIDEO_MODE }}
          OPENROUTER_VIDEO_TIMEOUT_MS: ${{ vars.OPENROUTER_VIDEO_TIMEOUT_MS }}
          OPENROUTER_VIDEO_MAX_DURATION_SEC: ${{ vars.OPENROUTER_VIDEO_MAX_DURATION_SEC }}
          OPENROUTER_VIDEO_MAX_TOKENS: ${{ vars.OPENROUTER_VIDEO_MAX_TOKENS }}
          STORAGE_MEDIA_BUCKET: ${{ vars.STORAGE_MEDIA_BUCKET }}
          STORAGE_THUMB_BUCKET: ${{ vars.STORAGE_THUMB_BUCKET }}
          MEDIA_SIGNED_URL_TTL_SECONDS: ${{ vars.MEDIA_SIGNED_URL_TTL_SECONDS }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          WORKER_IDLE_MS: ${{ vars.WORKER_IDLE_MS }}
          WORKER_RESCORE_EVERY: ${{ vars.WORKER_RESCORE_EVERY }}
          # Cloudflare R2 (preferred media backend when set — see src/lib/storage.ts)
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_THUMB_BUCKET: ${{ vars.R2_THUMB_BUCKET }}
          R2_MEDIA_BUCKET: ${{ vars.R2_MEDIA_BUCKET }}
          R2_THUMB_PUBLIC_BASE: ${{ vars.R2_THUMB_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SCRAPER_PROXY_URL: ${{ secrets.SCRAPER_PROXY_URL }}
          PROXY_CHEAP_API_KEY: ${{ secrets.PROXY_CHEAP_API_KEY }}
          PROXY_CHEAP_API_SECRET: ${{ secrets.PROXY_CHEAP_API_SECRET }}
          PROXY_TRAFFIC_CAP_GB: ${{ vars.PROXY_TRAFFIC_CAP_GB }}
          # Weekly digest email delivery (src/lib/email.ts — Resend HTTP API)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -e
          out="$GITHUB_WORKSPACE/.worker-env"
          : > "$out"
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL"            >> "$out"
          printf 'DIRECT_URL=%s\n' "$DIRECT_URL"                >> "$out"
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"            >> "$out"
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"  >> "$out"
          printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY" >> "$out"
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"        >> "$out"
          printf 'APIFY_API_KEY=%s\n' "$APIFY_API_KEY"          >> "$out"
          printf 'APIFY_SPEND_CAP_CENTS=%s\n' "$APIFY_SPEND_CAP_CENTS" >> "$out"
          printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" >> "$out"
          printf 'OPENROUTER_VIDEO_MODEL=%s\n' "$OPENROUTER_VIDEO_MODEL" >> "$out"
          printf 'OPENROUTER_VIDEO_MODE=%s\n' "$OPENROUTER_VIDEO_MODE" >> "$out"
          printf 'OPENROUTER_VIDEO_TIMEOUT_MS=%s\n' "$OPENROUTER_VIDEO_TIMEOUT_MS" >> "$out"
          printf 'OPENROUTER_VIDEO_MAX_DURATION_SEC=%s\n' "$OPENROUTER_VIDEO_MAX_DURATION_SEC" >> "$out"
          printf 'OPENROUTER_VIDEO_MAX_TOKENS=%s\n' "$OPENROUTER_VIDEO_MAX_TOKENS" >> "$out"
          printf 'STORAGE_MEDIA_BUCKET=%s\n' "$STORAGE_MEDIA_BUCKET" >> "$out"
          printf 'STORAGE_THUMB_BUCKET=%s\n' "$STORAGE_THUMB_BUCKET" >> "$out"
          printf 'MEDIA_SIGNED_URL_TTL_SECONDS=%s\n' "$MEDIA_SIGNED_URL_TTL_SECONDS" >> "$out"
          printf 'PUBLIC_URL=%s\n' "$PUBLIC_URL"                >> "$out"
          printf 'WORKER_IDLE_MS=%s\n' "$WORKER_IDLE_MS"        >> "$out"
          printf 'WORKER_RESCORE_EVERY=%s\n' "$WORKER_RESCORE_EVERY" >> "$out"
          printf 'R2_ENDPOINT=%s\n' "$R2_ENDPOINT"              >> "$out"
          printf 'R2_ACCOUNT_ID=%s\n' "$R2_ACCOUNT_ID"          >> "$out"
          printf 'R2_THUMB_BUCKET=%s\n' "$R2_THUMB_BUCKET"      >> "$out"
          printf 'R2_MEDIA_BUCKET=%s\n' "$R2_MEDIA_BUCKET"      >> "$out"
          printf 'R2_THUMB_PUBLIC_BASE=%s\n' "$R2_THUMB_PUBLIC_BASE" >> "$out"
          printf 'R2_ACCESS_KEY_ID=%s\n' "$R2_ACCESS_KEY_ID"    >> "$out"
          printf 'R2_SECRET_ACCESS_KEY=%s\n' "$R2_SECRET_ACCESS_KEY" >> "$out"
          printf 'SCRAPER_PROXY_URL=%s\n' "$SCRAPER_PROXY_URL"       >> "$out"
          printf 'PROXY_CHEAP_API_KEY=%s\n' "$PROXY_CHEAP_API_KEY"   >> "$out"
          printf 'PROXY_CHEAP_API_SECRET=%s\n' "$PROXY_CHEAP_API_SECRET" >> "$out"
          printf 'PROXY_TRAFFIC_CAP_GB=%s\n' "$PROXY_TRAFFIC_CAP_GB" >> "$out"
          printf 'SCRAPER_PROXY_COUNTRY=US\n'                        >> "$out"
          printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"             >> "$out"
          ls -la "$out"
          echo "lines: $(wc -l < "$out")"
          echo "video-model-marker: $(grep -c '^OPENROUTER_VIDEO_MODEL=' "$out")"
          echo "r2-endpoint-marker: $(grep -c '^R2_ENDPOINT=' "$out")"
          echo "resend-key-marker: $(grep -c '^RESEND_API_KEY=.\+' "$out")"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push worker image (with baked .env)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ghcr.io/man0l/slashloop-worker:master
            ghcr.io/man0l/slashloop-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Make the GHCR package PUBLIC so the VPS's watchtower can pull
      # ghcr.io/man0l/slashloop-worker:master with no docker login. For
      # personal-account packages GITHUB_TOKEN cannot manage visibility (404);
      # if a WRITE_PACKAGES_TOKEN PAT (write:packages) is configured as a repo
      # secret it is used instead. Both user- and repo-scoped endpoints are
      # tried so a scope change upstream can't silently break this.
      - name: Make GHCR package public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WRITE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          curl -s -X PUT "https://api.github.com/user/packages/container/slashloop-worker/visibility" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" -d '{"visibility":"public"}' -o /tmp/v1.json -w "user-scoped: %{http_code}\n"
          curl -s -X PUT "https://api.github.com/repos/man0l/slashloop/packages/container/slashloop-worker/visibility" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" -d '{"visibility":"public"}' -o /tmp/v2.json -w "repo-scoped: %{http_code}\n"
          cat /tmp/v1.json /tmp/v2.json | head -c 300 | tr '\n' ' '; echo
