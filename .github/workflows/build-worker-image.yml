name: build-worker-image

# Auto-build the VPS worker Docker image on changes to master, and push it to
# GitHub Container Registry (ghcr.io/man0l/slashloop-worker).
#
# Why paths: the image only changes when queue-drain / analysis code changes,
# not on docs or frontend tweaks — matching the "build if the worker's code has
# changed" rule. Build on old commits is a no-op; run the workflow manually
# (Actions -> build-worker-image -> Run workflow) to force a rebuild.
on:
  push:
    branches: [master]
    paths:
      - 'src/worker/**'
      - 'src/analysis/**'
      - 'src/lib/**'
      - 'src/scoring.ts'
      - 'src/register-tools.ts'
      - 'src/db.ts'
      - 'api/jobs/analyze.ts'
      - 'prisma/**'
      - 'worker/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/**'
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GITHUB_TOKEN with package write lets the build push to ghcr.io for
      # this repository — no extra secret needed.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ghcr.io/man0l/slashloop-worker:master
            ghcr.io/man0l/slashloop-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
