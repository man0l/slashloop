# Export the live STRIPE_PRICE_* values into the job summary.
#
# Price IDs are public identifiers (safe to print), so this is the one step
# between Stripe and the deploy pipeline that needs no masked values: read the
# summary, then either `gh variable set NAME value` or paste them into
# Settings → Variables. The deploy-worker workflow syncs them to the Worker.
#
# Re-run any time; it only reads.

name: Stripe Export Prices

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Stripe mode (live | test)'
        required: false
        default: live
        type: choice
        options: [live, test]

jobs:
  export:
    runs-on: ubuntu-latest
    # Same environment the stripe setup workflows use (STRIPE_SECRET_API_KEY).
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Export price IDs
        run: bun run src/scripts/stripe_export_prices.ts
        env:
          STRIPE_MODE_INPUT: ${{ inputs.mode }}
          STRIPE_SECRET_KEY: ${{ inputs.mode == 'test' && secrets.STRIPE_TEST_SECRET_KEY || secrets.STRIPE_SECRET_API_KEY }}
