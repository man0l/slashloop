name: Stripe Setup (one-off)

# Manual, one-shot: creates the Creator/Pro subscription products+prices and
# the credit-pack one-time price in Stripe, with the metadata
# api/stripe/webhook.ts and api/billing/checkout.ts depend on. Idempotent
# (src/scripts/stripe_setup.ts matches existing products/prices before
# creating), but meant to be run once and this file deleted after — see
# docs/stripe-implementation-plan.md §2.
#
# Prints the resulting Price IDs to the job summary; copy them into Vercel's
# STRIPE_PRICE_* env vars.
on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    # Scoped to the "production" GitHub Environment, same as db-push.yml —
    # see that file's comment. The secret there is named STRIPE_SECRET_API_KEY,
    # not STRIPE_SECRET_KEY (that's Vercel's runtime env var name, in
    # src/lib/stripe.ts — the two are unrelated systems and don't need to
    # match names, only this workflow's reference needs to match what's
    # actually in GitHub).
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Check secret is visible to this job
        run: |
          echo "STRIPE_SECRET_API_KEY length: ${#STRIPE_SECRET_API_KEY}"
        env:
          STRIPE_SECRET_API_KEY: ${{ secrets.STRIPE_SECRET_API_KEY }}

      - run: bun run src/scripts/stripe_setup.ts
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_API_KEY }}
