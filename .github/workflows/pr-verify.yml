# Fast, verify-only CI on every pull request.
#
# Why this exists: deploy-worker triggers only on `push` to master/main, so
# before this workflow an order-sensitive test could not be observed until
# after the merge had already fired the production deploy. Because `deploy` is
# `needs: verify`, a red verify on master then blocks EVERY later production
# deploy, not just the change that broke it — run 188 of deploy-worker is the
# proof: verify failed, deploy skipped, and the merged SHA never published.
# Nothing retried it, and the recovery is "the next successful publish of a
# descendant SHA". So the cost of an order-sensitive test was a stalled
# pipeline, not a red PR.
#
# This job moves that cost to where it belongs: a red check on the pull
# request, before the merge. It is deliberately the narrowest job that can
# prove the code is sound — typecheck + the full test suite, exactly the
# `verify` job in deploy-worker, so a PR that goes green here is not a
# surprise there.
#
# Security posture, deliberately different from deploy-worker:
#   - `pull_request`, never `pull_request_target`. The workflow definition
#     comes from the PR branch, so a fork's edits run without a privileged
#     context.
#   - `permissions: contents: read` at both workflow and job level. No write
#     token is minted for untrusted input.
#   - no `environment:`. The `production` environment holds the real deploy
#     credentials and is out of scope for this job, so nothing here can read
#     them even by accident.
#   - no `secrets.*` is referenced anywhere. The suite is expected to pass
#     without credentials; a test that needs one belongs behind an explicit
#     opt-in, not in the default PR gate.
#   - no wrangler, no D1 migration, no publish step. This workflow cannot
#     change production state.
#
# Not a deploy gate: nothing here publishes, and the strictness of
# `needs: verify` on `deploy` is unchanged.

name: pr-verify

on:
  pull_request:
    branches: [master, main]

# Repository default. `pull-requests: read` is deliberately NOT granted; the
# job needs no PR API access, and leaving it off keeps the token minimal.
permissions:
  contents: read

concurrency:
  # Superseded pushes on the same PR make an in-flight run worthless, so
  # cancel rather than queue. The opposite of deploy-worker, where
  # cancel-in-progress: false is what keeps one publish from evicting another.
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pin: bun@latest broke bun:sqlite db.query() inside db.transaction()
          # (credit-sql.test.ts prepareOwned). 1.4.2 is the last known-good.
          # Must stay identical to deploy-worker's pin, or a green PR proves
          # something the deploy gate never runs.
          bun-version: "1.4.2"

      - name: Install dependencies (generates both Prisma clients)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Do not add `--bail`, a shard, or a file filter here. This job's only
      # value is that its verdict matches the gate in deploy-worker exactly;
      # a narrower command would let a PR go green here and red there.
      - name: Tests
        run: bun test
