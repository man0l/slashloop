name: DB Push (one-off)

# Manual, one-shot: applies prisma/schema.prisma to the real database via
# `prisma db push` — no tracked migration history yet (see
# docs/stripe-implementation-plan.md's note on when to switch to
# `prisma migrate`). Meant to be deleted after use; see that doc for
# what it's applying (CreditLedger, StripeEvent, Workspace billing columns).
on:
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    # DATABASE_URL/DIRECT_URL are scoped to the "production" GitHub
    # Environment (Settings → Environments → production), not repository-
    # level secrets — a job only sees an Environment's secrets if it
    # declares that environment here.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      # Proves whether the secrets are actually reaching this job, without
      # ever printing the values themselves — GitHub Actions has no built-in
      # "is this secret set" indicator, and the standard env: block preview
      # at the top of a step's log renders empty either way (masked-to-blank
      # for a real value, genuinely blank for an unset one), so it can't
      # tell those two cases apart. A character count can.
      - name: Check secrets are visible to this job
        run: |
          echo "DATABASE_URL length: ${#DATABASE_URL}"
          echo "DIRECT_URL length: ${#DIRECT_URL}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - run: bun run db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
