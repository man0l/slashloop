# The same verify gate deploy-worker runs, on every pull request.
#
# deploy-worker.yml only triggers on a push to master, so its `verify` job —
# the one that caught the leaking mock.module in #96 — first ran AFTER that
# PR was merged, and the merge had to be unpicked. This runs the identical
# steps on the PR instead: typecheck, the full `bun test` suite, and the
# date-anchored suites under a shifted clock (SLA-323's guardrail), on the
# pinned bun, on a clean checkout with no workspace state.
#
# Read-only and secret-free by design: contents:read, no environment, no
# deploy job. Anything that needs a secret belongs in deploy-worker.yml, which
# stays the only path to production.

name: verify-pr

permissions:
  contents: read

on:
  pull_request:
    branches: [master, main]
  # Also run for the branch push, so a direct-to-branch author gets the signal
  # without opening a PR.
  push:
    branches-ignore: [master, main]

concurrency:
  group: verify-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pin matches deploy-worker.yml: bun@latest broke bun:sqlite
          # db.query() inside db.transaction() (credit-sql.test.ts
          # prepareOwned). 1.4.2 is the last known-good.
          bun-version: "1.4.2"

      - name: Install dependencies (generates both Prisma clients)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

      # SLA-323: a suite that stamps one instant with `new Date()` while reading
      # from a hardcoded date anchor only fails once the calendar moves, so CI
      # was green on the authoring day and red every day after — and `deploy` is
      # `needs: verify`. This runs the date-anchored suites under a shifted
      # clock so that class of bug fails the same day. Scoped on purpose: the
      # queue and timeout suites measure real elapsed time.
      - name: Tests (date-anchored suites under a shifted clock)
        run: bun run test:clock-shift
