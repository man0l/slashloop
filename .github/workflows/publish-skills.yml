name: Publish slashloop-skills

on:
  push:
    tags:
      - "slashloop-skills-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Verify bundled skill snapshot
        run: node packages/slashloop-skills/scripts/sync-skills.js && git diff --exit-code -- packages/slashloop-skills/skills
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
