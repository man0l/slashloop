# ===========================================================================
# MOVED (SLA-330) — this file is NOT a compose source. Do not edit it.
#
# It used to hold a full copy of the queue-db / queue-api / queue-backup
# service definitions. Nothing ever deployed them: the VPS runs
# `salonease/docker-compose.prod.yml`, and deploy policy forbids a second
# `-f` override file on the host. So this was a stale duplicate, drifting
# from the file that actually runs.
#
# Concretely, it was wrong in the ways that matter:
#   - queue-api carried `build:` + `image: slashloop-queue-api:phase1`,
#     while prod pulls `ghcr.io/man0l/slashloop-queue-api:master`.
#   - its queue-api interpolated secrets inline
#     (`${SLASHLOOP_QUEUE_HMAC_SECRET:?missing ...}`), which prod — per
#     operator preference — keeps in `/root/salonease/.env` + compose
#     `secrets.file`.
#   - its header documented an apply command that policy §1 forbids.
#
# Having two files that each claimed to be the source of truth is how a
# watchtower label came to be added to the mirror and missed in prod: a
# merged `src/queue/**` fix sat un-deployed for 4 days while the box looked
# freshly deployed, because the three workers *did* auto-update.
#
# ==> The deployed config is `man0l/salonease` @ `docker-compose.prod.yml`.
#     Edit queue service config THERE, via a branch + PR.
#     The CI gate that should assert those properties is SLA-332; it has to
#     read the deployed file, which is why it cannot live in this repo.
#
# `deploy/queue-compose.fragment.test.ts` keeps this file a stub.
# ===========================================================================